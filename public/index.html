<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USJP Stock Signal</title>
<style>
  :root {
    --bg:        #0d1117;
    --bg2:       #161b22;
    --bg3:       #21262d;
    --border:    #30363d;
    --text:      #e6edf3;
    --text2:     #8b949e;
    --long:      #3fb950;
    --long-bg:   rgba(63,185,80,0.12);
    --short:     #f85149;
    --short-bg:  rgba(248,81,73,0.12);
    --neutral:   #d29922;
    --neutral-bg:rgba(210,153,34,0.12);
    --accent:    #58a6ff;
    --high:      #58a6ff;
    --medium:    #d29922;
    --low:       #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ヘッダー */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .logo span { color: var(--text2); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .header-meta {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .score-badge {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .score-badge .num { color: var(--long); font-size: 15px; }

  /* タブ */
  .tabs {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    gap: 0;
  }
  .tab {
    padding: 12px 20px;
    cursor: pointer;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  /* メインコンテンツ */
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* サマリーバー */
  .summary-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    gap: 32px;
    align-items: center;
    flex-wrap: wrap;
  }
  .summary-item { display: flex; flex-direction: column; gap: 2px; }
  .summary-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; }
  .summary-value { font-size: 18px; font-weight: 700; }
  .summary-sub { font-size: 11px; color: var(--text2); }
  .up { color: var(--long); }
  .down { color: var(--short); }
  .flat { color: var(--neutral); }

  .market-grid {
    display: flex;
    gap: 12px;
    flex: 1;
    flex-wrap: wrap;
  }
  .market-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    min-width: 100px;
  }
  .market-name { font-size: 11px; color: var(--text2); }
  .market-chg { font-size: 15px; font-weight: 700; }

  /* 予測テーブル */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .count-chips {
    display: flex;
    gap: 8px;
    font-size: 12px;
  }
  .chip {
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 600;
  }
  .chip-long    { background: var(--long-bg);    color: var(--long); }
  .chip-short   { background: var(--short-bg);   color: var(--short); }
  .chip-neutral { background: var(--neutral-bg); color: var(--neutral); }

  .predict-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
  }
  .predict-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.15s;
  }
  .predict-card:hover { border-color: #484f58; }
  .predict-card.long    { border-left: 3px solid var(--long); }
  .predict-card.short   { border-left: 3px solid var(--short); }
  .predict-card.neutral { border-left: 3px solid var(--neutral); }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .theme-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .card-badges { display: flex; gap: 6px; align-items: center; }
  .pred-badge {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .pred-badge.long    { background: var(--long-bg);    color: var(--long); }
  .pred-badge.short   { background: var(--short-bg);   color: var(--short); }
  .pred-badge.neutral { background: var(--neutral-bg); color: var(--neutral); }
  .conf-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
  }
  .conf-dot.High   { background: var(--high); }
  .conf-dot.Medium { background: var(--medium); }
  .conf-dot.Low    { background: var(--low); }

  .signal-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text2);
  }
  .signal-ticker {
    font-family: 'SF Mono', monospace;
    font-weight: 600;
    color: var(--accent);
    font-size: 12px;
  }
  .signal-chg { font-weight: 600; font-size: 12px; }

  .card-reason {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }

  /* 答え合わせ */
  .answer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
  }
  .answer-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .answer-card.correct   { border-left: 3px solid var(--long); }
  .answer-card.incorrect { border-left: 3px solid var(--short); }
  .answer-card.skip      { border-left: 3px solid var(--border); }

  .answer-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .verdict-icon { font-size: 18px; }
  .answer-chg {
    font-size: 16px;
    font-weight: 700;
  }
  .answer-meta {
    font-size: 11px;
    color: var(--text2);
    display: flex;
    gap: 12px;
  }

  /* スコア履歴 */
  .score-section {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .score-big {
    font-size: 48px;
    font-weight: 800;
    color: var(--long);
    line-height: 1;
  }
  .score-label { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .score-stats {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .score-stat { display: flex; flex-direction: column; gap: 2px; }
  .score-stat-val { font-size: 20px; font-weight: 700; }
  .score-stat-label { font-size: 11px; color: var(--text2); }

  .history-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 13px;
  }
  .history-table th {
    text-align: left;
    padding: 8px 12px;
    color: var(--text2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }
  .history-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .history-table tr:last-child td { border-bottom: none; }
  .history-table tr:hover td { background: var(--bg3); }

  /* ローディング・エラー */
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--text2);
    font-size: 13px;
  }
  .loading::before {
    content: '';
    display: block;
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: var(--short-bg);
    border: 1px solid var(--short);
    border-radius: 6px;
    padding: 16px;
    color: var(--short);
    font-size: 13px;
    margin: 20px 0;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .date-selector {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--text2);
  }
  .date-selector select {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
  }

  .no-data {
    text-align: center;
    padding: 40px;
    color: var(--text2);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">USJP Stock Signal <span>米国市場→日本株テーマ予測</span></div>
  <div class="header-meta">
    <div class="score-badge">累積正解率 <span class="num" id="header-accuracy">--</span>%</div>
    <div id="header-date" style="color:var(--text2);font-size:12px;">--</div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="predict">予測</div>
  <div class="tab" data-tab="answer">答え合わせ</div>
  <div class="tab" data-tab="score">精度スコア</div>
</div>

<main>

  <!-- 予測タブ -->
  <div class="tab-content active" id="tab-predict">
    <div id="market-summary-area"></div>
    <div class="section-header">
      <div class="section-title">テーマ予測</div>
      <div class="count-chips" id="predict-chips"></div>
    </div>
    <div id="predict-area"><div class="loading">予測データを読み込み中</div></div>
  </div>

  <!-- 答え合わせタブ -->
  <div class="tab-content" id="tab-answer">
    <div class="section-header">
      <div class="section-title">答え合わせ</div>
      <div class="date-selector">
        日付:
        <select id="answer-date-select"></select>
      </div>
    </div>
    <div id="answer-area"><div class="loading">答え合わせデータを読み込み中</div></div>
  </div>

  <!-- スコアタブ -->
  <div class="tab-content" id="tab-score">
    <div id="score-area"><div class="loading">スコアデータを読み込み中</div></div>
  </div>

</main>

<script>
// =====================
// 設定
// =====================
const REPO_OWNER  = 'kou-ai-agent';
const REPO_NAME   = 'USJPStockSignal';
const BRANCH      = 'main';
const DATA_BASE   = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data`;

// 今日の日付（JST）
function todayJST() {
  const d = new Date(Date.now() + 9 * 3600 * 1000);
  return d.toISOString().slice(0,10).replace(/-/g,'');
}

async function fetchJSON(url) {
  const res = await fetch(url + '?t=' + Date.now());
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  return res.json();
}

// =====================
// タブ切り替え
// =====================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// =====================
// ユーティリティ
// =====================
function chgClass(v) {
  if (v === null || v === undefined) return '';
  return v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
}
function chgStr(v, digits=2) {
  if (v === null || v === undefined || isNaN(v)) return 'N/A';
  return (v >= 0 ? '+' : '') + v.toFixed(digits) + '%';
}
function predClass(p) {
  return p === 'Long' ? 'long' : p === 'Short' ? 'short' : 'neutral';
}
function predLabel(p) {
  return p === 'Long' ? '↑ Long' : p === 'Short' ? '↓ Short' : '→ Neutral';
}
function verdictIcon(v) {
  return v === 'correct' ? '✅' : v === 'incorrect' ? '❌' : '⏭';
}
function formatDate(yyyymmdd) {
  if (!yyyymmdd || yyyymmdd.length < 8) return yyyymmdd;
  return `${yyyymmdd.slice(0,4)}/${yyyymmdd.slice(4,6)}/${yyyymmdd.slice(6,8)}`;
}

// =====================
// 予測タブ
// =====================
async function loadPredict() {
  const today = todayJST();
  try {
    const [predict, usClose, master] = await Promise.all([
      fetchJSON(`${DATA_BASE}/predict_${today}.json`),
      fetchJSON(`${DATA_BASE}/us_close_${today}.json`),
      fetchJSON(`${DATA_BASE}/signal_master.json`),
    ]);

    document.getElementById('header-date').textContent = formatDate(today);

    // 市場サマリー
    renderMarketSummary(usClose);

    // 予測カード
    const signals = usClose.signals || {};
    renderPredictCards(predict, master, signals);

  } catch(e) {
    document.getElementById('predict-area').innerHTML =
      `<div class="error-msg">予測データの取得に失敗しました。<br>${e.message}</div>`;
    document.getElementById('market-summary-area').innerHTML = '';
  }
}

function renderMarketSummary(usClose) {
  const mkt = usClose.market_summary || {};
  const items = [
    { key: 'sp500',  label: 'S&P500' },
    { key: 'nasdaq', label: 'NASDAQ' },
    { key: 'dow',    label: 'DOW' },
    { key: 'vix',    label: 'VIX' },
    { key: 'dxy',    label: 'DXY' },
    { key: 'us10y',  label: '米10年債' },
  ];
  const html = items.map(({key, label}) => {
    const d = mkt[key] || {};
    const chg = d.change_pct;
    const cls = chgClass(chg);
    return `<div class="market-item">
      <div class="market-name">${label}</div>
      <div class="market-chg ${cls}">${chgStr(chg)}</div>
    </div>`;
  }).join('');

  document.getElementById('market-summary-area').innerHTML = `
    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-label">米国市場</div>
        <div style="font-size:12px;color:var(--text2)">${formatDate(usClose.date)}</div>
      </div>
      <div class="market-grid">${html}</div>
    </div>`;
}

function renderPredictCards(predict, master, signals) {
  const stats = predict.stats || {};
  document.getElementById('predict-chips').innerHTML = `
    <span class="chip chip-long">↑ Long ${stats.long ?? '--'}</span>
    <span class="chip chip-short">↓ Short ${stats.short ?? '--'}</span>
    <span class="chip chip-neutral">→ Neutral ${stats.neutral ?? '--'}</span>`;

  // テーマ別シグナル騰落率をmasterから引く
  const themeSignalMap = {};
  (master.themes || []).forEach(t => {
    themeSignalMap[t.theme] = t.us_signal;
  });

  const cards = (predict.predictions || []).map(p => {
    const pc   = predClass(p.prediction);
    const sig  = themeSignalMap[p.theme] || {};
    const prim = sig.primary || {};
    const sigData = signals[prim.ticker] || {};
    const chg  = sigData.change_pct;
    const chgCls = chgClass(chg);

    return `<div class="predict-card ${pc}">
      <div class="card-top">
        <div class="theme-name">${p.theme}</div>
        <div class="card-badges">
          <span class="conf-dot ${p.confidence}" title="${p.confidence}"></span>
          <span class="pred-badge ${pc}">${predLabel(p.prediction)}</span>
        </div>
      </div>
      <div class="signal-row">
        <span class="signal-ticker">${prim.ticker || '--'}</span>
        <span class="signal-chg ${chgCls}">${chgStr(chg)}</span>
        <span style="color:var(--text2)">${prim.name || ''}</span>
      </div>
      <div class="card-reason">${p.reason || ''}</div>
    </div>`;
  }).join('');

  document.getElementById('predict-area').innerHTML =
    `<div class="predict-grid">${cards}</div>`;
}

// =====================
// 答え合わせタブ
// =====================
async function loadAnswerDates() {
  // score_historyから日付一覧を取得
  try {
    const history = await fetchJSON(`${DATA_BASE}/score_history.json`);
    const records = (history.records || []).slice().reverse();
    const sel = document.getElementById('answer-date-select');
    sel.innerHTML = records.map(r =>
      `<option value="${r.date}">${formatDate(r.date)} (${r.accuracy}%)</option>`
    ).join('');
    if (records.length > 0) {
      loadAnswerByDate(records[0].date);
    } else {
      document.getElementById('answer-area').innerHTML =
        '<div class="no-data">答え合わせデータがまだありません。</div>';
    }
    sel.addEventListener('change', () => loadAnswerByDate(sel.value));
  } catch(e) {
    document.getElementById('answer-area').innerHTML =
      `<div class="error-msg">データ取得失敗: ${e.message}</div>`;
  }
}

async function loadAnswerByDate(date) {
  document.getElementById('answer-area').innerHTML =
    '<div class="loading">読み込み中</div>';
  try {
    const answer = await fetchJSON(`${DATA_BASE}/answer_${date}.json`);
    renderAnswerCards(answer);
  } catch(e) {
    document.getElementById('answer-area').innerHTML =
      `<div class="error-msg">答え合わせデータの取得に失敗: ${e.message}</div>`;
  }
}

function renderAnswerCards(answer) {
  const stats = answer.stats || {};
  const accuracy = stats.accuracy != null ? `${stats.accuracy}%` : '--';
  const header = `
    <div class="summary-bar" style="margin-bottom:16px;">
      <div class="summary-item">
        <div class="summary-label">本日正解率</div>
        <div class="summary-value" style="color:var(--long)">${accuracy}</div>
        <div class="summary-sub">${stats.correct ?? 0}正解 / ${stats.incorrect ?? 0}不正解 / ${stats.skip ?? 0}スキップ</div>
      </div>
    </div>`;

  const cards = (answer.results || []).map(r => {
    const vc  = r.verdict;
    const act = r.actual || {};
    const chg = act.avg_change_pct;
    const chgCls = chgClass(chg);
    const anomalyNote = act.anomaly_mode
      ? `<span title="セクター全体の動き">🔄</span>`
      : act.excluded_count > 0
        ? `<span title="${act.excluded_count}銘柄除外">⚠️${act.excluded_count}</span>`
        : '';

    return `<div class="answer-card ${vc}">
      <div class="answer-top">
        <div class="theme-name">${r.theme}</div>
        <span class="verdict-icon">${verdictIcon(vc)}</span>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <span class="pred-badge ${predClass(r.prediction)}">${predLabel(r.prediction)}</span>
        <span style="color:var(--text2);font-size:12px;">→ 実際:</span>
        <span class="pred-badge ${predClass(act.direction || 'Neutral')}">${predLabel(act.direction || 'Neutral')}</span>
        <span class="answer-chg ${chgCls}">${chgStr(chg)}</span>
        ${anomalyNote}
      </div>
      <div class="answer-meta">
        <span>${act.used_count ?? '--'}銘柄で判定</span>
        <span style="color:var(--text2);font-size:11px;">${r.reason ? r.reason.slice(0,40) + '...' : ''}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('answer-area').innerHTML =
    header + `<div class="answer-grid">${cards}</div>`;
}

// =====================
// スコアタブ
// =====================
async function loadScore() {
  try {
    const history = await fetchJSON(`${DATA_BASE}/score_history.json`);
    renderScore(history);
    document.getElementById('header-accuracy').textContent =
      history.overall_accuracy ?? '--';
  } catch(e) {
    document.getElementById('score-area').innerHTML =
      `<div class="error-msg">スコアデータ取得失敗: ${e.message}</div>`;
  }
}

function renderScore(history) {
  const accuracy = history.overall_accuracy != null ? `${history.overall_accuracy}` : '--';
  const records  = (history.records || []).slice().reverse();

  const rows = records.map(r => {
    const acc = r.accuracy != null ? `${r.accuracy}%` : '--';
    const accColor = r.accuracy >= 60 ? 'var(--long)' : r.accuracy >= 40 ? 'var(--neutral)' : 'var(--short)';
    return `<tr>
      <td>${formatDate(r.date)}</td>
      <td style="color:${accColor};font-weight:600;">${acc}</td>
      <td>${r.correct ?? 0}</td>
      <td>${r.incorrect ?? 0}</td>
      <td style="color:var(--text2)">${r.skip ?? 0}</td>
    </tr>`;
  }).join('');

  document.getElementById('score-area').innerHTML = `
    <div class="score-section">
      <div class="score-big">${accuracy}%</div>
      <div class="score-label">累積正解率（Long/Short判定のみ）</div>
      <div class="score-stats">
        <div class="score-stat">
          <div class="score-stat-val" style="color:var(--long)">${history.total_correct ?? 0}</div>
          <div class="score-stat-label">通算正解</div>
        </div>
        <div class="score-stat">
          <div class="score-stat-val" style="color:var(--short)">${history.total_incorrect ?? 0}</div>
          <div class="score-stat-label">通算不正解</div>
        </div>
        <div class="score-stat">
          <div class="score-stat-val" style="color:var(--text2)">${history.total_skip ?? 0}</div>
          <div class="score-stat-label">通算スキップ</div>
        </div>
        <div class="score-stat">
          <div class="score-stat-val">${records.length}</div>
          <div class="score-stat-label">運用日数</div>
        </div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">日別履歴</div>
    </div>
    ${records.length > 0 ? `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;">
      <table class="history-table">
        <thead>
          <tr>
            <th>日付</th>
            <th>正解率</th>
            <th>正解</th>
            <th>不正解</th>
            <th>スキップ</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>` : '<div class="no-data">まだ履歴がありません。</div>'}
  `;
}

// =====================
// 初期化
// =====================
async function init() {
  await Promise.all([
    loadPredict(),
    loadAnswerDates(),
    loadScore(),
  ]);
}

// タブクリック時にも再読み込みできるよう
document.querySelector('[data-tab="answer"]').addEventListener('click', () => {
  if (!document.getElementById('answer-date-select').innerHTML) {
    loadAnswerDates();
  }
});

init();
</script>
</body>
</html>
