name: 夕方の答え合わせ

on:
  schedule:
    # 毎日 PM4:15 JST = 07:15 UTC（月〜金）
    # 大引け15:30 + 45分バッファ
    - cron: '15 7 * * 1-5'
  workflow_dispatch:  # 手動実行も可能

jobs:
  answer-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージインストール
        run: pip install yfinance

      - name: 答え合わせ（answer_check.py）
        run: python scripts/answer_check.py

      - name: 生成ファイルをGitにコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/answer_*.json data/score_history.json
          git diff --cached --quiet || git commit -m "data: 答え合わせ $(date +'%Y%m%d' -d '+9 hours')"
          git push
