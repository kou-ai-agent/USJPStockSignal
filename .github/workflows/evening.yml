name: evening-answer-check

on:
  schedule:
    - cron: '15 7 * * 1-5'
  workflow_dispatch:

jobs:
  answer-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install-deps
        run: pip install yfinance requests

      - name: answer-check
        run: python scripts/answer_check.py

      - name: notify
        if: always()
        env:
          USJP_LINE_ACCESS_TOKEN: ${{ secrets.USJP_LINE_ACCESS_TOKEN }}
        run: python scripts/notify_evening.py

      - name: commit-and-push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/answer_*.json data/score_history.json data/index.json
          git diff --cached --quiet || git commit -m "data: answer and score $(date +'%Y%m%d' -d '+9 hours')"
          git pull --rebase origin main
          git push
