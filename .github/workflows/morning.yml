name: morning-fetch-and-predict

on:
  schedule:
    - cron: '30 20 * * 0-4'
  workflow_dispatch:

jobs:
  fetch-and-predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install-deps
        run: pip install yfinance anthropic requests

      - name: fetch-us
        run: python scripts/fetch_us.py

      - name: predict
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/predict.py

      - name: notify
        if: always()
        env:
          USJP_LINE_ACCESS_TOKEN: ${{ secrets.USJP_LINE_ACCESS_TOKEN }}
        run: python scripts/notify_morning.py

      - name: commit-and-push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us_close_*.json data/predict_*.json data/index.json
          git diff --cached --quiet || git commit -m "data: us-close and predict $(date +'%Y%m%d' -d '+9 hours')"
          git pull --rebase origin main
          git push
